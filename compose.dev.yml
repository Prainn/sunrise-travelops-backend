# Preserve existing dev database TLS and client access during the CI refactor.
services:
  api:
    # Optional, private dev-only HTTP receive configuration. Never pass it to migrations.
    env_file:
      - path: ./whatsapp-receive.env
        required: false
    environment:
      # This dev integration is receive-only, including after future API releases.
      WHATSAPP_CHAT_SEND_ENABLED: "false"
  postgres:
    networks:
      app: {}
      visits_read:
        aliases: [lynx-visits-db]
    ports: !override
      - "0.0.0.0:5432:5432"
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - ./postgres-tls:/certs:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
