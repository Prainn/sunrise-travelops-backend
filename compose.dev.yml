name: sunrise-travelops-dev

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: travelops_dev
  DATABASE_USER: travelops
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?required}
  DATABASE_SSL: "false"
  JWT_SECRET: ${JWT_SECRET:?required}
  JWT_EXPIRES_IN: 15m
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?required}
  REFRESH_TOKEN_EXPIRES_IN: 7d
  CORS_ORIGIN: https://ops-dev.sunrisevacation.cn
  TRUST_PROXY: "1"
  LOG_LEVEL: info

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: travelops_dev
      POSTGRES_USER: travelops
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?required}
      TZ: UTC
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      - "0.0.0.0:${DATABASE_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-tls:/certs:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelops -d travelops_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [dev]
    restart: unless-stopped
    logging: *logging

  migrate:
    image: ${API_IMAGE:?required}
    environment: *api-environment
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/data-source.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dev]
    profiles: [tools]
    restart: "no"
    logging: *logging

  api:
    image: ${API_IMAGE:?required}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [dev]
    restart: unless-stopped
    logging: *logging

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONFIG:-./nginx/dev.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./acme:/var/www/acme:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [dev]
    restart: unless-stopped
    logging: *logging

networks:
  dev:
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  postgres_data:
