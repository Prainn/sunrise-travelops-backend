# Preserve existing dev database TLS and client access during the CI refactor.
services:
  postgres:
    networks:
      app: {}
      visits_read:
        aliases: [lynx-visits-db]
    ports: !override
      - "0.0.0.0:5432:5432"
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - ./postgres-tls:/certs:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
  api:
    env_file:
      - path: ./oss-media.env
        required: false
    environment:
      WHATSAPP_CHAT_SEND_SOCKET: /run/sunrise-whatsapp-send-dev/send.sock
    group_add:
      - "2000"
    volumes: !override
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/share/ca-certificates:/usr/share/ca-certificates:ro
      - /run/sunrise-whatsapp-send-dev:/run/sunrise-whatsapp-send-dev:ro
      - /run/sunrise-oss-dev:/run/sunrise-oss-dev:ro
