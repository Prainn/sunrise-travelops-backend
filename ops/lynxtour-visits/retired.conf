# Installed only after both TravelOps visit ledgers have passed release checks.
# Keep this hostname explicit so it cannot fall through to another application.
server {
    listen 80;
    server_name lynxtour.sunrisevacation.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 410; }
}
server {
    listen 443 ssl;
    server_name lynxtour.sunrisevacation.cn;
    ssl_certificate /etc/letsencrypt/live/lynxtour.sunrisevacation.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lynxtour.sunrisevacation.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { return 410; }
}
