<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lynxtour 访问记录</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">LYNXTOUR · DEV</p><h1>访问记录</h1><p>WhatsApp 归因登记 · 只读</p></div><button id="refresh">刷新数据</button></header><section class="card"><div class="export-bar"><label for="start-date">开始日期 <input id="start-date" type="date" required></label><label for="end-date">结束日期 <input id="end-date" type="date" required></label><button id="export">下载 CSV</button><span>按创建日期（北京时间），包含起止当天，导出范围内全部记录</span></div><div class="toolbar"><span id="summary" role="status">正在读取…</span><span>按创建时间倒序 · 每页 50 条 · 北京时间列为创建时间转换，其余时间字段为 UTC</span></div><p id="error" role="alert" hidden></p><div class="table-wrap" tabindex="0" aria-label="访问记录，可横向滚动"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><footer><span id="page-label"></span><div><button id="prev">上一页</button><button id="next">下一页</button></div></footer></section></main></body></html>
