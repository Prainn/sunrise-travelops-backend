server {
    listen 80;
    server_name lynxtour.sunrisevacation.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / {
        default_type text/plain;
        return 503 "HTTPS setup pending DNS. Please try again shortly.\n";
    }
}
server {
    listen 443 ssl;
    server_name lynxtour.sunrisevacation.cn;
    ssl_reject_handshake on;
}
