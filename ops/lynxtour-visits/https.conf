server {
    listen 80;
    server_name lynxtour.sunrisevacation.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://lynxtour.sunrisevacation.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name lynxtour.sunrisevacation.cn;
    ssl_certificate /etc/letsencrypt/live/lynxtour.sunrisevacation.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lynxtour.sunrisevacation.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $viewer http://lynxtour-visits-dev:4080;
        proxy_pass $viewer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
