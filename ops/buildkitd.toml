[worker.oci]
  gc = true
  # Keep lint/build, production pruning and layer copies from competing for RAM.
  max-parallelism = 1
  reservedSpace = "2GB"
  maxUsedSpace = "4GB"
  minFreeSpace = "4GB"

# Match the existing ECS Docker registry mirrors.
[registry."docker.io"]
  mirrors = ["docker.1ms.run", "docker.xuanyuan.me"]
