# Install in the nginx http context only after deployment is authorized.
# Alibaba Cloud support ticket 000D0SMUPS, 2026-11-09 17:41 (Asia/Shanghai).
# Original TCP peer: forwarded headers must not grant callback access.
# This requires direct ingress; do not put a CDN/LB in front without revisiting it.
geo $realip_remote_addr $whatsapp_callback_allowed {
    default 0;
    47.241.245.145/32 1;
    47.241.229.207/32 1;
    47.74.208.184/32 1;
}

# Do not log query strings, Authorization or message bodies.
log_format whatsapp_callback '$realip_remote_addr [$time_local] '
    '$request_method $uri $status $request_time '
    'upstream_status=$upstream_status upstream_time=$upstream_response_time '
    'request_id=$request_id';
