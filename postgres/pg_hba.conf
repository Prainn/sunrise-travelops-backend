# Unix socket administration stays inside the container.
local all all trust
# Only the isolated application network may use unencrypted PostgreSQL.
host all all 172.30.80.0/24 scram-sha-256
# Public database access requires TLS and password authentication.
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
