name: Verify backend
on:
  pull_request:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
permissions:
  contents: read
  statuses: read
jobs:
  fork:
    name: Dispatch fork checks from the trusted base
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Select the exact candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Prainn/sunrise-travelops-backend
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          sha="$HEAD_SHA"
          if [[ -n "$PR" ]]; then
            [[ "$PR" =~ ^[0-9]+$ ]]
            data=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
            test "$(jq -r .head.sha <<< "$data")" = "$HEAD_SHA"
            sha=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/pull/$PR/merge" | cut -f1)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            # A required status on the PR head must refer to a merge with that exact head.
            parents=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '[.parents[].sha] | join(" ")')
            test "$parents" = "$(jq -r .base.sha <<< "$data") $HEAD_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          for target in $(printf '%s\n' "$sha" "$HEAD_SHA" | sort -u); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$target" -f state=pending -f context=isolated-fork-backend \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          done
      - name: Run checks in a disposable sandbox on the build host
        env:
          KEY: ${{ secrets.ISOLATED_CI_SSH_KEY }}
          HOST_KEY: ${{ vars.ISOLATED_CI_HOST_KEY }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temp=$(mktemp -d); trap 'rm -rf -- "$temp"' EXIT
          printf '%s\n' "$KEY" > "$temp/key"
          printf '%s\n' "$HOST_KEY" > "$temp/hosts"
          unset KEY
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$temp/hosts" -i "$temp/key" sunrise-ci-check@ops-dev.sunrisevacation.cn "$SHA"
      - name: Publish the required check
        if: always() && steps.candidate.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          SHA: ${{ steps.candidate.outputs.sha }}
          HEAD_SHA: ${{ steps.candidate.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          for target in $(printf '%s\n' "$SHA" "$HEAD_SHA" | sort -u); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$target" -f state="$state" -f context=isolated-fork-backend \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          done

  verify:
    name: verify-backend
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Run checks in a disposable sandbox on the build host
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEY: ${{ secrets.ISOLATED_CI_SSH_KEY }}
          HOST_KEY: ${{ vars.ISOLATED_CI_HOST_KEY }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temp=$(mktemp -d); trap 'rm -rf -- "$temp"' EXIT
          printf '%s\n' "$KEY" > "$temp/key"
          printf '%s\n' "$HOST_KEY" > "$temp/hosts"
          unset KEY
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$temp/hosts" -i "$temp/key" sunrise-ci-check@ops-dev.sunrisevacation.cn "$SHA"
      - name: Await the isolated check for this exact fork merge commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 190); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
              --jq '.statuses | map(select(.context == "isolated-fork-backend")) | .[0].state // "pending"')
            case "$state" in success) exit 0 ;; failure|error) exit 1 ;; esac
            sleep 30
          done
          exit 1
