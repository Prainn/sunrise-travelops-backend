name: Verify backend
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: verify-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: travelops_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-only
      DATABASE_NAME: travelops_ci
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: python3 scripts/test_deploy.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release
      - name: Empty database migrations and repeat execution
        run: |
          node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js --transaction all
          node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js --transaction all
