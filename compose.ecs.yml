name: sunrise-travelops-${DEPLOY_ENV:?required}

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: travelops_${DEPLOY_ENV:?required}
  DATABASE_USER: travelops
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?required}
  DATABASE_SSL: "false"
  JWT_SECRET: ${JWT_SECRET:?required}
  JWT_EXPIRES_IN: 15m
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?required}
  WHATSAPP_RESOLVER_TOKEN: ${WHATSAPP_RESOLVER_TOKEN:?required}
  REFRESH_TOKEN_EXPIRES_IN: 7d
  CORS_ORIGIN: ${CORS_ORIGIN:?required}
  TRUST_PROXY: "1"
  LOG_LEVEL: info

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: travelops_${DEPLOY_ENV:?required}
      POSTGRES_USER: travelops
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?required}
      TZ: UTC
    ports:
      - "127.0.0.1:${DATABASE_HOST_PORT:?required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelops -d travelops_${DEPLOY_ENV:?required}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  migrate:
    image: ${API_IMAGE:?required}
    environment: *api-environment
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/data-source.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]
    profiles: [tools]
    restart: "no"
    logging: *logging

  api:
    image: ${API_IMAGE:?required}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      app:
        aliases: ["api-${DEPLOY_ENV}"]
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  dozzle:
    image: amir20/dozzle:v10.7.5
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=sunrise-travelops-${DEPLOY_ENV:?required}
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 12h
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    networks:
      app:
        aliases: ["dozzle-${DEPLOY_ENV}"]
    restart: unless-stopped
    logging: *logging

networks:
  app:
    external: true
    name: ${APP_NETWORK:?required}

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:?required}
  dozzle_data:
    external: true
    name: ${DOZZLE_VOLUME:?required}
