server {
    listen 80;
    server_name status.sunrisevacation.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name status.sunrisevacation.cn;
    ssl_certificate /etc/letsencrypt/live/status.sunrisevacation.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.sunrisevacation.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/status;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    location = / { try_files /index.html =404; }
    location = /status.json { try_files $uri =404; }
    location = /status.css { try_files $uri =404; }
    location = /status.mjs { types { application/javascript mjs; } try_files $uri =404; }
    location / { return 404; }
}
