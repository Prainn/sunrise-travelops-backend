server {
    listen 80;
    server_name ops-dev.sunrisevacation.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name ops-dev.sunrisevacation.cn;
    ssl_certificate /etc/letsencrypt/live/ops-dev.sunrisevacation.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops-dev.sunrisevacation.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/dev/current;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /__deploy.json { add_header Cache-Control "no-cache"; }
    location ~ ^/(js|css|img|fonts|media|assets)/ {
        root /srv/dev/shared;
        try_files $uri =404;
        expires 7d;
    }
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8089;
    server_name ops-dev.sunrisevacation.cn;
    root /srv/dev/current;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /__deploy.json { add_header Cache-Control "no-cache"; }
    location ~ ^/(js|css|img|fonts|media|assets)/ {
        root /srv/dev/shared;
        try_files $uri =404;
        expires 7d;
    }
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
