server {
    listen 80;
    server_name dev-log.sunrisevacation.cn;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name dev-log.sunrisevacation.cn;
    ssl_certificate /etc/letsencrypt/live/dev-log.sunrisevacation.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-log.sunrisevacation.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $log_upstream sunrise-travelops-dev-dozzle-1:8080;
        proxy_pass http://$log_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
